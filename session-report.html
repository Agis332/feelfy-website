<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Session report</title>
<!-- Feelfy support's decision page for a "Something wrong with the session?"
     report (SportMatch PLAN.md B53 step 5b). Opened only from the Decide
     button in support's alert email: https://feelfy.app/session-report#t=<token>
     (older alerts' buttons add &a=<action>, which pre-selects that choice).
     The token stays in the fragment, which the browser never sends;
     session-report.js removes it from the address bar at once and talks to
     the decide-session-report function. Everything shown comes from that
     function's answer, set with textContent. No external scripts, fonts or
     images; _headers gives this page its own Content-Security-Policy. -->
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fefdfa;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
  header{margin-bottom:28px}
  header img{height:40px;width:auto;display:block}
  h1{font-size:28px;line-height:1.15;letter-spacing:-0.02em;margin:0 0 20px}
  h2{font-size:18px;line-height:1.3;margin:28px 0 10px}
  [hidden]{display:none !important}
  .card{border:1px solid #e8e6df;border-radius:12px;background:#fff;padding:14px 16px;margin:0 0 12px}
  .rows{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
  .rows dt{color:#6d6c67}
  .rows dd{margin:0;text-align:right;overflow-wrap:anywhere}
  .rows .total{font-weight:700;color:#111;border-top:1px solid #e8e6df;padding-top:6px}
  .description{margin:12px 0 0;padding-top:10px;border-top:1px solid #f1f0ec;white-space:pre-wrap;overflow-wrap:anywhere}
  .description-label{display:block;color:#6d6c67;margin-bottom:2px}
  .deadline{margin:20px 0 0;font-size:17px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:24px 0 16px}
  button{font:inherit;cursor:pointer;border-radius:10px;padding:12px 14px;min-height:46px}
  button:disabled{cursor:default;opacity:.5}
  .choice{background:#fff;color:#208AEF;border:1.5px solid #208AEF;font-weight:600}
  .choice[aria-pressed="true"]{background:#208AEF;color:#fff}
  .panel{border:1px solid #e8e6df;border-radius:12px;background:#fff;padding:16px}
  .panel p{margin:0 0 14px}
  .confirm{width:100%;background:#208AEF;color:#fff;border:0;font-weight:700}
  .field{display:flex;align-items:center;gap:8px;margin:0 0 12px}
  .field label{flex:1}
  .field span{color:#6d6c67}
  .field input{width:120px;font:inherit;padding:10px 12px;border:1px solid #d6d4cc;border-radius:8px;text-align:right}
  .field input[aria-invalid="true"]{border-color:#DC2626}
  .result{margin:16px 0 0;padding:14px 16px;border-radius:12px;white-space:pre-line}
  .result.ok{background:#ECFDF3;border:1px solid #A7E3BD}
  .result.err{background:#FEF2F2;border:1px solid #F5B5B5}
  .message{margin:0;font-size:17px}
</style>
<script src="session-report.js"></script>
</head>
<body>
<div class="wrap">

<header><img src="uploads/darkimage.png" alt="Feelfy"></header>

<main>
  <h1>Session report</h1>
  <p id="message" class="message" role="status" hidden></p>

  <div id="details" hidden>
    <div id="reports"></div>

    <h2>Session</h2>
    <div class="card"><dl id="session" class="rows"></dl></div>

    <h2>Amounts</h2>
    <div class="card"><dl id="amounts" class="rows"></dl></div>

    <p class="deadline">Decide by: <strong id="deadline"></strong><span id="extended"></span></p>

    <div class="choices">
      <button type="button" class="choice" data-choice="release" aria-pressed="false">Release to the trainer</button>
      <button type="button" class="choice" data-choice="refund" aria-pressed="false">Refund the client</button>
      <button type="button" class="choice" data-choice="split" aria-pressed="false">Split</button>
      <button type="button" class="choice" data-choice="extend" aria-pressed="false">Extend</button>
    </div>

    <div id="panel-release" class="panel" hidden>
      <p id="release-question"></p>
      <button type="button" class="confirm" data-confirm="release">Confirm</button>
    </div>

    <div id="panel-refund" class="panel" hidden>
      <p id="refund-question"></p>
      <button type="button" class="confirm" data-confirm="refund">Confirm</button>
    </div>

    <div id="panel-split" class="panel" hidden>
      <div class="field">
        <label for="split-client">To the client</label>
        <span>€</span>
        <input id="split-client" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="split-trainer">To the trainer</label>
        <span>€</span>
        <input id="split-trainer" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">
      </div>
      <p id="split-kept"></p>
      <button type="button" class="confirm" data-confirm="split">Confirm</button>
    </div>

    <div id="panel-extend" class="panel" hidden>
      <p>Extend the deadline by 7 days?</p>
      <p id="extend-deadline" hidden></p>
      <button type="button" class="confirm" data-confirm="extend">Confirm</button>
    </div>

    <p id="result" class="result" role="status" hidden></p>
  </div>
</main>

</div>
</body>
</html>
